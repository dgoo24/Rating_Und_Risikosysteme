[server]
headless = true
runOnSave = false
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#E6001E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F9"
textColor = "#262626"
linkColor = "#E6001E"
borderColor = "#E3E5E8"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "small"
buttonRadius = "small"
font = "sans-serif"
headingFontSizes = ["30px", "24px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseFontSize = 15
chartCategoricalColors = ["#E6001E", "#454957", "#F5A623", "#8C0011", "#B7BFC9", "#6E7B8B", "#E88FA0"]
chartSequentialColors = ["#FFF5F6", "#FDE3E7", "#FBC7CE", "#F7AAB5", "#F28C9C", "#E45F76", "#D23C58", "#BE1F3D", "#A3001F", "#7C0016"]
greenColor = "#13795B"
redColor = "#E6001E"
orangeColor = "#B25E09"
blueColor = "#33506B"
grayColor = "#6B6B6B"
